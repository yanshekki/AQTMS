<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <!-- Primary accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <!-- Secondary gradient -->
    <linearGradient id="secondaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <!-- Neon glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8"/>

  <!-- Outer ring (circuit/tech feel) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.3" stroke-dasharray="8 4"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#secondaryGrad)" stroke-width="1" opacity="0.2" stroke-dasharray="4 8"/>

  <!-- Data flow arcs -->
  <path d="M 100 180 Q 180 80 300 100" stroke="url(#accentGrad)" stroke-width="2" fill="none" opacity="0.6" filter="url(#softGlow)"/>
  <path d="M 360 160 Q 420 280 340 380" stroke="url(#secondaryGrad)" stroke-width="2" fill="none" opacity="0.6" filter="url(#softGlow)"/>
  <path d="M 140 360 Q 80 260 120 200" stroke="url(#accentGrad)" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- DOT nodes on arcs -->
  <circle cx="180" cy="130" r="4" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="400" cy="260" r="4" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="110" cy="280" r="4" fill="#3b82f6" filter="url(#glow)"/>

  <!-- Main letters: A Q -->
  <text x="130" y="310" font-family="'Inter','Segoe UI',sans-serif" font-size="160" font-weight="900" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.95">A</text>
  <text x="260" y="310" font-family="'Inter','Segoe UI',sans-serif" font-size="160" font-weight="900" fill="url(#secondaryGrad)" filter="url(#glow)" opacity="0.95">Q</text>

  <!-- Data bars (representing trading/quant) -->
  <rect x="80" y="360" width="12" height="60" rx="2" fill="url(#accentGrad)" opacity="0.7" filter="url(#softGlow)"/>
  <rect x="100" y="340" width="12" height="80" rx="2" fill="url(#secondaryGrad)" opacity="0.85" filter="url(#softGlow)"/>
  <rect x="120" y="370" width="12" height="50" rx="2" fill="url(#accentGrad)" opacity="0.6"/>
  <rect x="140" y="330" width="12" height="90" rx="2" fill="url(#accentGrad)" opacity="0.9" filter="url(#softGlow)"/>
  <rect x="160" y="350" width="12" height="70" rx="2" fill="url(#secondaryGrad)" opacity="0.75"/>
  <rect x="180" y="380" width="12" height="40" rx="2" fill="url(#accentGrad)" opacity="0.5"/>

  <!-- Upward trend arrow (bullish) -->
  <polyline points="340,400 360,375 380,365 400,340" stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <polygon points="400,340 392,350 408,348" fill="#22c55e" filter="url(#softGlow)"/>

  <!-- Subtitle -->
  <text x="256" y="430" font-family="'Inter','Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#6b7280" text-anchor="middle" letter-spacing="6">AUTOMATED</text>
  <text x="256" y="452" font-family="'Inter','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle" letter-spacing="4">QUANTITATIVE TRADING</text>

  <!-- Corner tech brackets -->
  <path d="M 50 130 L 50 70 L 110 70" stroke="url(#accentGrad)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 462 70 L 402 70 L 402 130" stroke="url(#accentGrad)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 50 382 L 50 442 L 110 442" stroke="url(#secondaryGrad)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 462 442 L 402 442 L 402 382" stroke="url(#secondaryGrad)" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Pulse circles -->
  <circle cx="420" cy="180" r="6" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.8">
    <animate attributeName="r" values="6;18;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="180" r="3" fill="#00f0ff" filter="url(#glow)"/>

  <circle cx="420" cy="220" r="4" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8">
    <animate attributeName="r" values="4;14;4" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="220" r="2" fill="#8b5cf6" filter="url(#glow)"/>
</svg>
