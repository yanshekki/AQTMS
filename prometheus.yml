# ── Prometheus Configuration ──
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aqtms-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:3001']
        labels:
          service: 'aqtms-api'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

rule_files: []

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
