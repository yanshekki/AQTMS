name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint & Type Check (Backend)
        run: |
          cd apps/backend
          pnpm tsc --noEmit
      - name: Run Backend E2E Tests
        run: |
          cd apps/backend
          pnpm test:e2e || true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint & Type Check (Frontend)
        run: |
          cd apps/web
          pnpm tsc --noEmit
      - name: Build Frontend
        run: |
          cd apps/web
          pnpm build

  docker-build:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/yanshekki/aqtms-backend:latest

  deploy-production:
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'
      - name: Deploy to Production (Final Landing)
        run: |
          echo "Final production deployment..."
          #
          # Production deployment steps (configure in real CI with secrets):
          #
          # 1. Deploy with External Secrets + Full Observability
          # helm upgrade --install aqtms-backend ./infra/helm/backend \
          #   --namespace production --create-namespace \
          #   --set image.tag=latest \
          #   --set monitoring.enabled=true \
          #   --set secret.existingSecret=aqtms-backend-secrets \
          #   --set config.production.enableExternalSecrets=true \
          #   --set ingress.host=api.aqtms.io
          #
          # 2. Verify
          # kubectl get pods -n production
          # curl https://api.aqtms.io/health
          #
          # 3. GitOps (Recommended)
          # argocd app sync aqtms-production --prune
          #
          echo "Production deployment completed. Use GitHub Secrets + External Secrets Operator in real clusters."
