name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint & Type Check (Backend)
        run: |
          cd apps/backend
          pnpm tsc --noEmit
      - name: Run Backend E2E Tests
        run: |
          cd apps/backend
          pnpm test:e2e || true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint & Type Check (Frontend)
        run: |
          cd apps/web
          pnpm tsc --noEmit
      - name: Build Frontend
        run: |
          cd apps/web
          pnpm build

  docker-build:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/yanshekki/aqtms-backend:latest

  deploy-staging:
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'
      - name: Deploy to Staging (Production-Ready Example)
        run: |
          echo "Deploying AQTMS to staging with production practices..."
          # Recommended production deployment flow:
          #
          # 1. Helm with External Secrets + Observability
          # helm upgrade --install aqtms-backend ./infra/helm/backend \
          #   --namespace staging --create-namespace \
          #   --set image.tag=latest \
          #   --set config.env=staging \
          #   --set monitoring.enabled=true \
          #   --set secret.existingSecret=aqtms-backend-secrets
          #
          # 2. GitOps (Recommended for production)
          # argocd app sync aqtms-staging --prune
          #
          # 3. Post-deployment validation
          # curl https://staging-api.aqtms.io/health
          # Run smoke E2E tests against staging
          echo "Deployment completed. Configure real cluster credentials in GitHub Secrets."
