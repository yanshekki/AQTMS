apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aqtms-backend-secrets
  namespace: aqtms
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: aqtms-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: aqtms/production/backend
        property: jwt_secret
    - secretKey: DATABASE_URL
      remoteRef:
        key: aqtms/production/backend
        property: database_url
    - secretKey: ENCRYPTION_SECRET
      remoteRef:
        key: aqtms/production/backend
        property: encryption_secret
    # Add more as needed (API keys, Redis, Telegram token, etc.)
