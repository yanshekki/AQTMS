replicaCount: 3

image:
  repository: aqtms-backend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3001

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 2Gi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 5
  periodSeconds: 5

env:
  NODE_ENV: production
  LOG_LEVEL: info
  CORS_ORIGIN: "*"
  ENABLE_TESTNET: "false"
  ENABLE_PAPER_TRADING: "true"
  ENABLE_KILL_SWITCH: "true"
  # Observability
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
  OTEL_SERVICE_NAME: aqtms-backend
  OTEL_TRACES_SAMPLER: always_on

secret:
  enabled: true
  existingSecret: aqtms-backend-secrets   # Use External Secrets Operator in production
  keys:
    - JWT_SECRET
    - ENCRYPTION_SECRET
    - DATABASE_URL
    - REDIS_URL
    - BINANCE_API_KEY
    - BINANCE_API_SECRET
    - BYBIT_API_KEY
    - BYBIT_API_SECRET
    - TELEGRAM_BOT_TOKEN

ingress:
  enabled: true
  className: nginx
  host: api.aqtms.io
  tls:
    enabled: true
    secretName: aqtms-tls

monitoring:
  enabled: true
  serviceMonitor: true
  prometheusRule: true
  # Observability stack
  loki:
    enabled: true
  tempo:
    enabled: true

config:
  testnet:
    enabled: false
  production:
    enableResourceQuotas: true
    enableNetworkPolicies: true
    enablePodDisruptionBudget: true
