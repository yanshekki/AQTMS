replicaCount: 3

image:
  repository: aqtms-backend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3001

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 2Gi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 5
  periodSeconds: 5

env:
  NODE_ENV: production
  LOG_LEVEL: info
  CORS_ORIGIN: "*"
  # Testnet / Live mode control
  ENABLE_TESTNET: "true"
  # Feature flags for testing
  ENABLE_PAPER_TRADING: "true"
  ENABLE_KILL_SWITCH: "true"

secret:
  enabled: true
  existingSecret: aqtms-backend-secrets
  keys:
    - JWT_SECRET
    - ENCRYPTION_SECRET
    - DATABASE_URL
    - REDIS_URL
    - BINANCE_API_KEY
    - BINANCE_API_SECRET
    - BYBIT_API_KEY
    - BYBIT_API_SECRET

ingress:
  enabled: true
  className: nginx
  host: api.aqtms.io
  tls:
    enabled: true
    secretName: aqtms-tls

monitoring:
  enabled: true
  serviceMonitor: true

# For testnet vs live configuration
config:
  testnet:
    enabled: true
    binanceTestnet: true
    bybitTestnet: true
